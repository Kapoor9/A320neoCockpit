<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// multi-core radio voice: install the isolation helper once, then reload into it (sw-coi.js)
(function () {
  if (window.crossOriginIsolated || !('serviceWorker' in navigator) || !window.isSecureContext) return;
  if (!/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return;   // only where the site is hosted by us
  var again = function () { try { if (sessionStorage.getItem('coi')) return; sessionStorage.setItem('coi', '1'); } catch (e) { return; } location.reload(); };
  navigator.serviceWorker.register('sw-coi.js').then(function () {
    if (navigator.serviceWorker.controller) again(); else navigator.serviceWorker.addEventListener('controllerchange', again);
  }).catch(function () {});
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A320neo Cockpit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<style>
  :root{--ink:#e4e6e1;--dim:#9aa3a8;--bar:rgba(30,34,38,.78);--btn:#3d464c;--btn-sel:#5a646b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1d2124;color:var(--ink);font:14px/1.4 "Helvetica Neue",Arial,sans-serif;overflow:hidden}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #view:active{cursor:grabbing}
  #top{position:fixed;left:14px;top:12px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #top b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  #top span{font-size:12px;color:var(--dim)}
  #views{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    background:var(--bar);padding:7px;border-radius:6px;max-width:calc(100% - 20px);backdrop-filter:blur(4px)}
  #views button{background:var(--btn);border:1px solid #2a3035;border-radius:4px;color:var(--ink);padding:9px 12px;min-height:38px;
    font:600 12px Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
  #state{position:fixed;right:12px;top:10px;display:flex;gap:6px;background:var(--bar);padding:6px;border-radius:6px;backdrop-filter:blur(4px)}
  #state button{background:var(--btn);border:1px solid #2a3035;border-radius:4px;color:var(--ink);padding:7px 10px;font:600 11px Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
  #views button.sel{background:var(--btn-sel);border-color:#7d878d}
  #views button:focus-visible{outline:2px solid #9aa3a8;outline-offset:1px}
  .ctl-tip{position:fixed;left:0;top:0;display:none;pointer-events:none;z-index:5;background:rgba(18,21,24,.88);border:1px solid #3a4248;border-radius:4px;padding:5px 8px;font:12px/1.35 Arial,sans-serif;color:var(--ink);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .ctl-tip b{font-weight:600;letter-spacing:.03em}.ctl-tip span{color:var(--dim);font-size:11px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2124;color:var(--dim);letter-spacing:.1em}
  @media (max-width:600px){#views{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;left:8px;right:8px;transform:none;max-width:none;scroll-snap-type:x proximity}#views button{flex:none;padding:8px 10px;font-size:11px;scroll-snap-align:start}#top span{display:none}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">LOADING COCKPIT…</div>
<div id="top"><b>A320neo flight deck</b><span>Drag to look · scroll or pinch to zoom · double-click to look closer · click, drag or scroll any control to operate it · Esc returns to seat</span></div>
<nav id="views" aria-label="Views"></nav>
<nav id="state" aria-label="Aircraft state"></nav>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module" src="./src/cockpit/main.js"></script>
</body>
</html>
