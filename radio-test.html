<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>
// multi-core radio voice: install the isolation helper once, then reload into it (sw-coi.js)
(function () {
  if (window.crossOriginIsolated || !('serviceWorker' in navigator) || !window.isSecureContext) return;
  if (!/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return;   // only where the site is hosted by us
  var again = function () { try { if (sessionStorage.getItem('coi')) return; sessionStorage.setItem('coi', '1'); } catch (e) { return; } location.reload(); };
  navigator.serviceWorker.register('sw-coi.js').then(function () {
    if (navigator.serviceWorker.controller) again(); else navigator.serviceWorker.addEventListener('controllerchange', again);
  }).catch(function () {});
})();
</script>
<title>Radio self-test</title>
<style>body{font:14px/1.5 monospace;background:#111;color:#ddd;padding:16px}b{color:#8be28b}.e{color:#ff6b6b}</style></head>
<body><h3>A320 radio self-test</h3><div id="log"></div>
<script type="module">
// Checks, on this host, the three parts of the radio: starter set, neural voice (TTS) and speech recognition (STT).
const log = (t, bad) => { const d = document.createElement('div'); d.textContent = t; if (bad) d.className = 'e'; document.getElementById('log').appendChild(d); };
const t0 = performance.now(), s = () => ((performance.now() - t0) / 1000).toFixed(1) + 's';
log('browser: ' + navigator.userAgent);
try { const j = await (await fetch('public/sounds/atc_starter.json')).json(); log('starter set OK: ' + Object.keys(j).join(', ') + ' ' + s()); } catch (e) { log('starter set FAILED: ' + e, 1); }
const tts = new Worker('./src/audio/ttsWorker.js', { type: 'module' });
const stt = new Worker('./src/audio/sttWorker.js', { type: 'module' });
tts.onerror = (e) => log('voice worker error: ' + e.message, 1); stt.onerror = (e) => log('speech worker error: ' + e.message, 1);
let pcm24 = null, sttReady = false;
const tryStt = async () => {
  if (!pcm24 || !sttReady) return;
  const ctx = new OfflineAudioContext(1, Math.ceil(pcm24.length * 16000 / 24000), 16000), b = ctx.createBuffer(1, pcm24.length, 24000); b.copyToChannel(pcm24, 0);
  const src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(); const pcm = (await ctx.startRendering()).getChannelData(0).slice();
  window.T2 = performance.now(); stt.postMessage({ type: 'stt', id: 1, pcm }, [pcm.buffer]);
};
tts.onmessage = (e) => { const m = e.data; if (m.type === 'progress') return;
  if (m.type === 'ready') { log('voice model ready ' + s()); window.T1 = performance.now(); tts.postMessage({ type: 'say', id: 1, text: 'Delhi Ground, Indigo two four five, radio check.', voice: { a: 'hm_omega', b: 'bm_george', w: 0.7 }, lang: 'en-us', speed: 1.1 }); }
  else if (m.type === 'audio') { pcm24 = m.pcm; log('voice OK: ' + (m.pcm.length / 24000).toFixed(1) + ' s of speech in ' + ((performance.now() - T1) / 1000).toFixed(1) + ' s'); tryStt(); }
  else log('voice FAILED: ' + m.msg, 1); };
stt.onmessage = (e) => { const m = e.data; if (m.type === 'progress') return;
  if (m.type === 'ready') { sttReady = true; log('speech recognition ready ' + s()); tryStt(); }
  else if (m.type === 'text') { log('speech recognition OK in ' + ((performance.now() - T2) / 1000).toFixed(1) + ' s, heard: "' + m.text + '"'); log('ALL OK'); }
  else log('speech recognition FAILED: ' + m.msg, 1); };
tts.postMessage({ type: 'init', base: new URL('vendor/tts/', location.href).href, threads: Math.max(1, Math.min(6, Math.floor((navigator.hardwareConcurrency || 2) / 2))) });
log('isolated (multi-core): ' + crossOriginIsolated + ', cores ' + navigator.hardwareConcurrency);
stt.postMessage({ type: 'init', ort: new URL('vendor/tts/ort.wasm.min.mjs', location.href).href, base: new URL('vendor/stt/', location.href).href });
log('loading models (first visit downloads ~140 MB, later visits use the browser cache)…');
</script></body></html>
